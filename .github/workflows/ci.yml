name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y lua5.2

      - name: Run Lua tests
        run: lua5.2 computer/codex/tests/run.lua

      - name: Test installer package validation
        run: lua5.2 tests/installer/run.lua

      - name: Check shipped entrypoint syntax
        run: |
          lua5.2 -e '
            local files = {
              "install.lua",
              "computer/codex.lua",
              "computer/startup/cc_codex.lua",
              "computer/codex/platform/cc/remote_bootstrap.lua"
            }
            for _, path in ipairs(files) do
              assert(loadfile(path), path)
            end
          '
